name: Release

# Three-stage release flow:
#
#   1. Push to main → `prepare-release` job opens / updates a release PR
#      titled "chore: prepare releases vX.Y.Z" containing the version bump
#      and regenerated changelog.
#   2. Merging that PR → `release` job runs `knope release`, which creates
#      the git tag and the GitHub Release. The tag push is what triggers
#      publish.yml, which performs the actual pub.dev publish.
#
# The release job pushes the tag using `secrets.RELEASE_PAT` rather than the
# default GITHUB_TOKEN — events triggered by GITHUB_TOKEN don't fire
# downstream workflows (GH's recursive-workflow guard), so a token-pushed
# tag would never trigger publish.yml.
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  prepare-release:
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: prepare releases')"
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the `release` branch
      pull-requests: write   # open / update the release PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # knope walks commit history since last tag

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Knope
        uses: knope-dev/action@8055388a38df33f0603050415ac3d8175d6b566f

      # continue-on-error: knope exits non-zero when there are no changes
      # to release (no conventional commits since last tag). That's expected
      # on commits that don't warrant a bump — don't fail the workflow.
      - name: knope prepare-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: knope prepare-release --verbose
        continue-on-error: true

  release:
    if: github.head_ref == 'release' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag, create GitHub release
    steps:
      # Checkout with the PAT so the tag push knope performs uses PAT auth.
      # GITHUB_TOKEN-driven tag pushes don't trigger publish.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Knope
        uses: knope-dev/action@8055388a38df33f0603050415ac3d8175d6b566f

      - name: knope release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: knope release
