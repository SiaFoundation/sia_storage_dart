name: Publish

# Triggered when knope's `release` job pushes a vX.Y.Z tag. Builds the
# wasm bundle and publishes the package to pub.dev via OIDC trusted 
# publishing.
#
# Pub.dev requires the publishing workflow to be triggered by a tag push:
# https://dart.dev/tools/pub/automated-publishing
#
# Configure pub.dev → Admin → Automated publishing with:
#   Repository:    SiaFoundation/sia_storage_dart
#   Tag pattern:   v{{version}}
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # pub.dev OIDC token exchange
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2

      - name: Setup Environment
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
          # frb needs nightly (-Z build-std for threaded wasm)
          rustup toolchain install nightly --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly
          # frb generate runs rustfmt with cwd=rust/, where rust-toolchain.toml
          # pins an exact toolchain version; without rustfmt on that toolchain
          # frb silently emits unformatted bindings (warn-and-continue) and
          # the verify step below fails on formatting alone.
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" --profile minimal --component rustfmt
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: dart pub get

      # Installs flutter_rust_bridge_codegen pinned to the runtime version,
      # regenerates the bindings, and builds web/pkg from them.
      - name: Build wasm bundle
        run: tool/build_web.sh

      # build_web.sh regenerated the bindings; if that changed anything vs
      # the reviewed release commit, the tarball wouldn't match what was
      # reviewed (codegen drift or a stale committed side) — bail.
      - name: Verify regenerated bindings match the release commit
        run: git diff --exit-code

      - name: dart pub publish
        run: dart pub publish --force
