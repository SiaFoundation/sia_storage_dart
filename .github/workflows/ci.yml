name: CI

on:
  push:
    branches: 
      - main
  pull_request:

jobs:
  # Flutter pins several packages (meta, collection, ...) at exact versions
  # via the SDK, so a dependency constraint can conflict with those pins and
  # make the package unresolvable for Flutter apps even though plain
  # `dart pub get` succeeds — 0.3.0 shipped like that (hooks 2.1.0 requires
  # meta ^1.19.0 vs Flutter stable's pinned meta 1.17.0). Resolve the
  # package from a scratch Flutter app to catch it here instead.
  flutter-resolvable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable

      - name: Check resolvability against Flutter stable
        run: |
          mkdir -p "$RUNNER_TEMP/consumer/lib"
          cat > "$RUNNER_TEMP/consumer/pubspec.yaml" <<EOF
          name: consumer
          environment:
            sdk: ^3.10.0
          dependencies:
            flutter:
              sdk: flutter
            sia_storage:
              path: $GITHUB_WORKSPACE
          dev_dependencies:
            flutter_test:
              sdk: flutter
          EOF
          cd "$RUNNER_TEMP/consumer"
          flutter pub get
